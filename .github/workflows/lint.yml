name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docs:
    name: Check Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          check-latest: true
          cache: "pnpm"

      - name: Check docs formatting
        run: |
          pnpm install
          pnpm format:check:docs

  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        command: ["lint", "typecheck", "format:check"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/krypton"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: src/pnpm-lock.yaml

      - name: pnpm ${{ matrix.command }}
        run: |
          cd src
          pnpm install --frozen-lockfile
          pnpm ${{ matrix.command }}
