name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_PASSWORD" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD (Docker Hub access token)."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: wg:build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker tag wg:build "docker.io/${DOCKERHUB_USERNAME}/wg:latest"
          docker tag wg:build "docker.io/${DOCKERHUB_USERNAME}/wg:${GITHUB_SHA}"
          docker push "docker.io/${DOCKERHUB_USERNAME}/wg:latest"
          docker push "docker.io/${DOCKERHUB_USERNAME}/wg:${GITHUB_SHA}"

      - name: Push to GHCR
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          docker tag wg:build "ghcr.io/${repo}:latest"
          docker tag wg:build "ghcr.io/${repo}:${GITHUB_SHA}"
          docker push "ghcr.io/${repo}:latest"
          docker push "ghcr.io/${repo}:${GITHUB_SHA}"
