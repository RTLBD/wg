name: Publish Docker image

on:
  push:
    tags:
      - '*-traffic-limit'
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.prebuilt'
      - 'scripts/build-fork-image.sh'
      - 'src/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Build app bundle
        working-directory: src
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Prepare docker artifacts
        run: |
          rm -rf docker-artifacts
          mkdir -p docker-artifacts
          cp -R src/.output docker-artifacts/.output
          cp -R src/server/database/migrations docker-artifacts/migrations

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/lamirshahinxl/wg-easy:15-traffic-limit
