name: wg-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wgeasy
      POSTGRES_PASSWORD: wgeasy
      POSTGRES_DB: wgeasy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wgeasy -d wgeasy']
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command: check:docker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wgeasy:wgeasy@postgres:5432/wgeasy
      PORT: "51821"
      HOST: 0.0.0.0
