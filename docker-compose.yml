volumes:
  etc_wireguard:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: wg-postgres
    environment:
      POSTGRES_USER: wgeasy
      POSTGRES_PASSWORD: wgeasy
      POSTGRES_DB: wgeasy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wgeasy -d wgeasy']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wg
    restart: unless-stopped

  wg:
    build: .
    image: wg:local
    pull_policy: never
    container_name: wg
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Dhaka
      INSECURE: "true"
      DATABASE_URL: postgresql://wgeasy:wgeasy@postgres:5432/wgeasy
    #  Optional:
    #  - PORT=51821
    #  - HOST=0.0.0.0
    #  - INSECURE=false
    #  - LEGACY_SQLITE_PATH=/etc/wireguard/wg-easy.db
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
